<style>
  :root {
    --bg: #eef0f3;
    --panel: #ffffff;
    --ink: #0f141a;
    --soft: #69747f;
    --line: #d9dee4;
    --field: #f3f5f7;
    --accent: #0f6b5c;
    --accent-ink: #ffffff;
    --danger: #b0412e;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", "Courier New", monospace;
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- top bar ---------- */
  .topbar {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    padding: 10px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 {
    grid-column: 2;
    margin: 0;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--soft);
  }
  .seg {
    grid-column: 3;
    justify-self: end;
    display: flex;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    font-size: 11px;
    font-weight: 700;
    color: var(--soft);
    padding: 5px 9px;
    cursor: pointer;
  }
  .seg input:checked + label { background: var(--accent); color: var(--accent-ink); }

  /* ---------- rows ---------- */
  .sheet {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 10px max(14px, env(safe-area-inset-right, 0px)) 14px max(14px, env(safe-area-inset-left, 0px));
  }
  .rows {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 24px 1fr 20px 1fr 34px;
    align-items: center;
    gap: 6px;
    padding: 7px 8px 7px 4px;
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: none; }
  .row .idx {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--soft);
    text-align: center;
  }
  .row input {
    width: 100%;
    min-width: 0;
    border: 1px solid transparent;
    background: var(--field);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 19px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 11px 6px;
    border-radius: 10px;
    appearance: textfield;
    -moz-appearance: textfield;
  }
  .row input::-webkit-outer-spin-button,
  .row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .row input::placeholder { color: var(--soft); font-weight: 500; opacity: 0.7; }
  .row input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--panel);
  }
  .row .times {
    text-align: center;
    color: var(--soft);
    font-size: 15px;
    font-weight: 600;
  }
  .row .kill {
    width: 30px; height: 30px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--soft);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    visibility: hidden;
  }
  .row.filled .kill { visibility: visible; }
  .row .kill:active { color: var(--danger); background: var(--field); }

  .addrow {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    background: transparent;
    color: var(--accent);
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .addrow:active { background: var(--panel); }

  /* ---------- totals ---------- */
  .totals {
    flex: none;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  }
  .line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: var(--soft);
    padding: 3px 0;
  }
  .line .v {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--ink);
    font-size: 15px;
  }
  .line.off .v { opacity: 0.3; }
  .tick {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    font-weight: 600;
    padding: 4px 0;
  }
  .tick input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }

  .grand {
    text-align: center;
    margin-top: 8px;
    padding-top: 10px;
    border-top: 1.5px solid var(--line);
  }
  .grand .v {
    font-size: 34px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .actions button {
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-clear {
    flex: 1;
    background: var(--field);
    color: var(--soft);
    border: 1px solid var(--line) !important;
  }
  .btn-print {
    flex: 1.5;
    background: var(--field);
    color: var(--ink);
    border: 1px solid var(--line) !important;
  }
  .btn-bt {
    flex: 1.9;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .btn-print:active, .btn-clear:active, .btn-bt:active { opacity: 0.8; }
  #clip {
    position: fixed;
    left: -9999px;
    top: 0;
    width: 1px; height: 1px;
    opacity: 0;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(190px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--panel);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 999px;
    z-index: 50;
    max-width: calc(100% - 32px);
    text-align: center;
  }

  /* ---------- print ---------- */
  #receipt { display: none; }
  @media print {
    body { display: block; overflow: visible; }
    body * { visibility: hidden; }
    #receipt, #receipt * { visibility: visible; }
    #receipt {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      font-family: var(--mono);
      color: #000;
      background: #fff;
      padding: 2mm;
    }
    body.p58 #receipt { width: 58mm; }
    body.p80 #receipt { width: 80mm; }
    #receipt { text-align: center; }
    #receipt .h { font-weight: 700; font-size: 13px; letter-spacing: 0.1em; margin-bottom: 7px; }
    #receipt .it { font-size: 16px; font-weight: 600; padding: 3px 0; }
    #receipt .rule { border-top: 1px dashed #000; margin: 7px auto; }
    #receipt .tot { font-weight: 700; font-size: 26px; margin-top: 5px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Estimate</h1>
  <div class="seg">
    <input type="radio" name="paper" id="p58" value="58" checked><label for="p58">58</label>
    <input type="radio" name="paper" id="p80" value="80"><label for="p80">80</label>
  </div>
</div>

<div class="sheet">
  <div class="rows" id="rows"></div>
  <button class="addrow" id="add">+ Add row</button>
</div>

<div class="totals">
  <div class="line" id="pct-line">
    <label class="tick"><input type="checkbox" id="pct-on"> 5%</label>
    <span class="v" id="pct">0</span>
  </div>
  <div class="grand">
    <span class="v" id="total">0</span>
  </div>
  <div class="actions">
    <button class="btn-clear" id="clear">Clear</button>
    <button class="btn-print" id="print">Print</button>
    <button class="btn-bt" id="bt">Bluetooth</button>
    <textarea id="clip" readonly aria-hidden="true"></textarea>
  </div>
</div>

<div id="receipt"></div>

<script>
(function () {
  var rowsEl  = document.getElementById('rows');
  var pctEl   = document.getElementById('pct');
  var pctLine = document.getElementById('pct-line');
  var pctOn   = document.getElementById('pct-on');
  var totalEl = document.getElementById('total');

  function fmt(n) {
    if (!isFinite(n)) n = 0;
    return Math.round(n).toLocaleString('en-IN');
  }

  function addRow(focus) {
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<span class="idx"></span>' +
      '<input type="number" inputmode="decimal" class="qty" placeholder="Qty">' +
      '<span class="times">&times;</span>' +
      '<input type="number" inputmode="decimal" class="rate" placeholder="Rate">' +
      '<button class="kill" type="button" aria-label="Delete row">&times;</button>';
    rowsEl.appendChild(row);

    row.querySelectorAll('input').forEach(function (inp) {
      inp.addEventListener('input', function () {
        ensureBlankRow();
        recalc();
      });
    });
    row.querySelector('.kill').addEventListener('click', function () {
      row.remove();
      if (!rowsEl.children.length) addRow();
      ensureBlankRow();
      recalc();
    });

    if (focus) row.querySelector('.qty').focus();
    return row;
  }

  function rowHasValue(row) {
    return row.querySelector('.qty').value !== '' || row.querySelector('.rate').value !== '';
  }

  // Always keep exactly one empty row at the bottom, so there is
  // nothing to tap between one line and the next.
  function ensureBlankRow() {
    var rows = Array.prototype.slice.call(rowsEl.children);
    var last = rows[rows.length - 1];
    if (last && rowHasValue(last)) addRow();
  }

  function recalc() {
    var sub = 0, n = 0;
    Array.prototype.forEach.call(rowsEl.children, function (row) {
      var qty  = parseFloat(row.querySelector('.qty').value)  || 0;
      var rate = parseFloat(row.querySelector('.rate').value) || 0;
      var has  = rowHasValue(row);
      row.classList.toggle('filled', has);
      row.querySelector('.idx').textContent = has ? ++n : '';
      sub += qty * rate;
    });

    var pct = pctOn.checked ? sub * 0.05 : 0;
    pctEl.textContent   = fmt(pct);
    pctLine.classList.toggle('off', !pctOn.checked);
    totalEl.textContent = fmt(sub + pct);
  }

  pctOn.addEventListener('change', recalc);
  document.getElementById('add').addEventListener('click', function () { addRow(true); });

  document.getElementById('clear').addEventListener('click', function () {
    rowsEl.innerHTML = '';
    addRow(); addRow(); addRow();
    recalc();
  });

  // ---- print ----
  function buildReceipt() {
    var body = '', sub = 0;
    Array.prototype.forEach.call(rowsEl.children, function (row) {
      var qty  = parseFloat(row.querySelector('.qty').value)  || 0;
      var rate = parseFloat(row.querySelector('.rate').value) || 0;
      if (!qty && !rate) return;
      var amt = qty * rate;
      sub += amt;
      body += '<div class="it">' + qty + ' &times; ' + fmt(rate) + '</div>';
    });

    var pct = pctOn.checked ? sub * 0.05 : 0;
    var html = '<div class="h">ESTIMATE</div>';
    html += body;
    if (pct) html += '<div class="it">+ 5% = ' + fmt(pct) + '</div>';
    html += '<div class="rule"></div>';
    html += '<div class="tot">' + fmt(sub + pct) + '</div>';
    document.getElementById('receipt').innerHTML = html;
  }

  // ---- direct-to-printer via RawBT (Android, Bluetooth) ----
  // Builds plain ESC/POS text and hands it to RawBT with a rawbt:base64 link,
  // bypassing Chrome's print dialog entirely.
  function escposSlip() {
    var ESC = '\x1B', GS = '\x1D';
    var NORMAL = GS + '!' + '\x00';
    var TALL   = GS + '!' + '\x01';   // double height
    var BIG    = GS + '!' + '\x11';   // double height + width
    var BOLD_ON = ESC + 'E' + '\x01', BOLD_OFF = ESC + 'E' + '\x00';

    var s = ESC + '@';                // reset
    s += ESC + 'a' + '\x01';          // centre everything

    s += BOLD_ON + 'ESTIMATE' + BOLD_OFF + '\n\n';

    var sub = 0;
    Array.prototype.forEach.call(rowsEl.children, function (row) {
      var qty  = parseFloat(row.querySelector('.qty').value)  || 0;
      var rate = parseFloat(row.querySelector('.rate').value) || 0;
      if (!qty && !rate) return;
      sub += qty * rate;
      s += TALL + qty + ' x ' + fmt(rate) + NORMAL + '\n';
    });

    var pct = pctOn.checked ? sub * 0.05 : 0;
    if (pct) s += TALL + '+ 5% = ' + fmt(pct) + NORMAL + '\n';

    s += '--------------------------------\n';
    s += BIG + BOLD_ON + fmt(sub + pct) + BOLD_OFF + NORMAL + '\n';
    s += '\n\n\n';
    return s;
  }

  // Plain monospace slip, centred to 32 columns, for pasting into a
  // printer app (iPhone has no RawBT equivalent).
  function textSlip() {
    var W = 32;
    var mid = function (t) {
      var pad = Math.max(0, Math.floor((W - t.length) / 2));
      return new Array(pad + 1).join(' ') + t;
    };
    var out = [mid('ESTIMATE'), ''];

    var sub = 0;
    Array.prototype.forEach.call(rowsEl.children, function (row) {
      var qty  = parseFloat(row.querySelector('.qty').value)  || 0;
      var rate = parseFloat(row.querySelector('.rate').value) || 0;
      if (!qty && !rate) return;
      sub += qty * rate;
      out.push(mid(qty + ' x ' + fmt(rate)));
    });

    var pct = pctOn.checked ? sub * 0.05 : 0;
    if (pct) out.push(mid('+ 5% = ' + fmt(pct)));

    out.push(new Array(W + 1).join('-'));
    out.push(mid(fmt(sub + pct)));
    return out.join('\n');
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  var canShare = !!(navigator.share);
  var btBtn = document.getElementById('bt');
  if (isIOS) btBtn.textContent = canShare ? 'Send to printer' : 'Copy slip';

  function copySlip(text) {
    var done = function () { toast('Slip copied - paste into your printer app'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
    } else {
      legacyCopy(text, done);
    }
  }

  btBtn.addEventListener('click', function () {
    if (!isIOS) {
      window.location.href = 'rawbt:base64,' + btoa(escposSlip());
      return;
    }
    var text = textSlip();
    // iOS: hand the slip to the printer app through the share sheet.
    // Falls back to the clipboard when sharing isn't available (local files).
    if (canShare) {
      navigator.share({ text: text }).catch(function (err) {
        if (err && err.name === 'AbortError') return;   // user dismissed
        copySlip(text);
      });
    } else {
      copySlip(text);
    }
  });

  function legacyCopy(text, done) {
    var ta = document.getElementById('clip');
    ta.value = text;
    ta.removeAttribute('readonly');
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.setAttribute('readonly', '');
    if (ok) done(); else toast('Could not copy - long-press the total to select');
  }

  document.getElementById('print').addEventListener('click', function () {
    buildReceipt();
    var paper = document.querySelector('input[name="paper"]:checked').value;
    document.body.classList.remove('p58', 'p80');
    document.body.classList.add('p' + paper);
    window.print();
  });

  addRow(); addRow(); addRow();
  recalc();
})();
</script>

</body>
</html>
